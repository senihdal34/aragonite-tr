appId: io.aragonite.notes.debug
---
# Home (newspaper layout): masthead, lead story, columns and thumbnails for notes that never had one.
- launchApp
- extendedWaitUntil:
    visible: "Notlar"
    timeout: 20000
- assertVisible: "THY Rapor"
- assertVisible: "Yeni Finans Ürün Planı"
- assertVisible: "Gün 1- 14 Eylül"
- assertVisible: ".*YENİ NOT YAZ"
- assertVisible: "AYARLAR"
# thumbnails are rendered in the background (long notes take a while)
- extendedWaitUntil:
    visible: "Notlar"
    timeout: 90000
- takeScreenshot: .e2e-shots/home
