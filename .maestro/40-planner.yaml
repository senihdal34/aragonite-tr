appId: io.aragonite.notes.debug
---
# Home opens on the Weekly Planner (week number, year progress, one column per day). A day opens in front of the
# page with typed to-do lines that save as you type.
# Week tools move the week; NOTLAR shows the note cards with delete and tag buttons; a topic can be deleted.
- launchApp
- extendedWaitUntil:
    visible: "WEEKLY PLANNER"
    timeout: 40000
- assertVisible: "YIL %.* TAMAMLANDI"
- assertVisible: "HAFTA .*/5[23]"
# open today in front of the page, write on the first line, tick it, add more lines, go back
- tapOn: "Günü aç bugün"
- tapOn: "Madde 1"
- inputText: "e2egorev"
- hideKeyboard
- tapOn: "Tamamlandı işaretle"
- scrollUntilVisible:
    element: "\\+ 4 SATIR EKLE"
- tapOn: "\\+ 4 SATIR EKLE"
- assertVisible: "Madde 12"
- tapOn: "← GERİ"
- assertVisible: "e2egorev"
- tapOn: "SONRAKİ ›"
- tapOn: "BU HAFTA"
- assertVisible: "BUGÜN.*"
- tapOn: "NOTLAR"
- extendedWaitUntil:
    visible: "# SEÇ"
    timeout: 20000
- assertVisible: "BUGÜN|DÜN|.* ÖNCE"
# tag: add a new one; it becomes a topic
- tapOn:
    text: "\\+ ETİKET"
    index: 0
- inputText: "e2etest"
- tapOn: "EKLE"
- extendedWaitUntil:
    visible: "E2ETEST"
    timeout: 10000
# delete the topic: asks first
- tapOn: "E2ETEST"
- tapOn: "KONUYU SİL"
- assertVisible: "KONU SİLİNSİN Mİ\\?"
- tapOn: "SİL"
- extendedWaitUntil:
    notVisible: "E2ETEST"
    timeout: 10000
# delete a note: asks first, "Vazgeç" keeps it, "Sil" removes it
- tapOn:
    text: "Notu sil"
    index: 0
- assertVisible: "NOT SİLİNSİN Mİ\\?"
- tapOn: "VAZGEÇ"
- tapOn:
    text: "Notu sil"
    index: 0
- tapOn: "SİL"
- extendedWaitUntil:
    notVisible: "NOT SİLİNSİN Mİ\\?"
    timeout: 10000
